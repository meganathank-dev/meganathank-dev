name: Refresh GitHub profile cards

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Generate authenticated GitHub profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          EXCLUDE: ""
          AUTO_PUSH: true
          THEME: github_dark
          ANIMATION: load
          DURATION: 3
          NAME: Meganathan K
